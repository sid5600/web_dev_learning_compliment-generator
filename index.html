<!DOCTYPE html>
<html lang="en">
<header>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compliment Generator</title>
</header>
<body>
    <head>
        <h1>Compliment Generator</h1>
    </head>
    <main>
        <p>This is a simple compliment generator that pulls a random compliment from a list of pre-defined compliments.</p>
        <p id="compliment"></p>
        <button>Generate Compliment</button>
        <select>
            <options>All</options>
            <options>Funny</options>
            <options>Motivational</options>
            <options>silly</options>
        </select>
    </main>
    <footer>
        <p>Compliment Generator. All rights reserved.</p>
    </footer>
</body> 
</html>
